<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Player CRM data model</title>
<desc>Ten entities: the player at the centre with three compositions holding history, four lookups, and the compensation catalogue with its link table</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="490" fill="#ffffff"/>

