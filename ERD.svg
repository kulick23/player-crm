</g>

<g>
  <rect x="195" y="280" width="145" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="267" y="302" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">LoyaltyProgram</text>
