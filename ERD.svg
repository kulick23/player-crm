  <text x="132" y="82" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">PlayerStatus</text>
  <text x="132" y="100" text-anchor="middle" font-size="12" fill="#444441">codes and colours</text>
</g>

